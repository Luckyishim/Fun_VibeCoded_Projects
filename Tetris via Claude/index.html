<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Minimal Tetris</title>
    <style>
        body {
            background: #1a1a2e;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
        }

        #game {
            border: 2px solid #fff;
            background: #000;
        }

        #score {
            position: absolute;
            top: 20px;
            color: #fff;
            font-size: 24px;
        }
    </style>
</head>

<body>
    <div id="score">Score: 0</div>
    <canvas id="game" width="300" height="600"></canvas>
    <script src="tetris.js"></script>
</body>

</html>
