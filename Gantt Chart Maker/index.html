<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal Gantt Chart Studio</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: #f0f2f5; margin: 20px; color: #333; }
        .app-container { display: flex; flex-direction: column; gap: 20px; max-width: 1600px; margin: 0 auto; }
        
        .panel { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        h2 { margin-top: 0; font-size: 18px; color: #111; }
        p.subtitle { font-size: 13px; color: #666; margin-top: -8px; margin-bottom: 15px; }

        .controls-row { display: flex; gap: 20px; flex-wrap: wrap; align-items: center; margin-bottom: 15px; }
        .control-group { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; }
        
        button { background-color: #0d6efd; color: white; border: none; padding: 8px 16px; border-radius: 4px; font-weight: 600; cursor: pointer; transition: 0.2s; }
        button:hover { background-color: #0b5ed7; }
        button.btn-add { background-color: #198754; }
        button.btn-add:hover { background-color: #157347; }
        button.btn-parse { background-color: #0dcaf0; color: #000; }
        button.btn-parse:hover { background-color: #31d2f2; }
        button.btn-danger { background-color: #dc3545; padding: 4px 8px; font-size: 12px; }

        textarea.import-box { width: 100%; height: 160px; padding: 10px; border: 1px solid #ced4da; border-radius: 6px; font-family: monospace; font-size: 12px; resize: vertical; margin-bottom: 10px; }

        .table-wrapper { max-height: 280px; overflow-y: auto; border: 1px solid #dee2e6; border-radius: 4px; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; text-align: left; }
        th, td { padding: 8px 12px; border-bottom: 1px solid #dee2e6; }
        th { background-color: #f8f9fa; position: sticky; top: 0; }
        input.cell-input, select.cell-input { width: 100%; border: 1px solid #ced4da; padding: 4px 6px; border-radius: 3px; font-size: 13px; }
        input.num-input { width: 65px; }

        .chart-preview-container { overflow-x: auto; background-color: #e9ecef; padding: 15px; border-radius: 6px; text-align: center; }
        canvas { background-color: #ffffff; box-shadow: 0 2px 5px rgba(0,0,0,0.15); }
    </style>
</head>
<body>

<div class="app-container">

    <!-- Text Importer (Clean, No Forced Default Text) -->
    <div class="panel">
        <h2>1. Paste Project Text / Outline</h2>
        <p class="subtitle">Paste your project outline or raw task lists below and click parse to populate the chart.</p>
        <textarea id="importText" class="import-box" placeholder="Paste your task list or project outline here..."></textarea>
        <div style="display: flex; gap: 10px;">
            <button class="btn-parse" onclick="parseTextToTasks()">🚀 Auto-Generate Chart from Text</button>
            <button style="background-color: #6c757d;" onclick="clearImportText()">Clear Input</button>
        </div>
    </div>

    <!-- Timeline & View Settings -->
    <div class="panel">
        <h2>2. View & Timeline Settings</h2>
        <div class="controls-row">
            <div class="control-group">
                <label for="timeMode">Timeline Scale: </label>
                <select id="timeMode" class="cell-input" style="width: 140px;" onchange="renderGantt()">
                    <option value="weeks" selected>Weeks (Merged Months)</option>
                    <option value="months">Months (Merged Quarters)</option>
                    <option value="days">Days</option>
                </select>
            </div>
            <div class="control-group">
                <label for="startDate">Project Start Date: </label>
                <input type="date" id="startDate" class="cell-input" style="width: 150px;" value="2026-06-14" onchange="renderGantt()">
            </div>
            <div class="control-group">
                <label for="rowSpacing">Row Spacing: </label>
                <input type="range" id="rowSpacing" min="25" max="65" value="38" oninput="renderGantt()">
                <span id="rowSpacingVal">38px</span>
            </div>
            <div class="control-group">
                <label for="barHeight">Bar Height: </label>
                <input type="range" id="barHeight" min="10" max="32" value="18" oninput="renderGantt()">
                <span id="barHeightVal">18px</span>
            </div>
            <button onclick="exportFullImage()">📸 Download High-Res PNG Image</button>
        </div>

        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
            <h2 style="margin:0;">3. Live Task Table</h2>
            <button class="btn-add" onclick="addTask()">+ Add Row</button>
        </div>
        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th style="width: 100px;">ID</th>
                        <th>Task Name</th>
                        <th style="width: 110px;">Type</th>
                        <th style="width: 90px;">Start</th>
                        <th style="width: 90px;">End</th>
                        <th style="width: 60px;">Action</th>
                    </tr>
                </thead>
                <tbody id="taskTableBody"></tbody>
            </table>
        </div>
    </div>

    <!-- Live Output -->
    <div class="panel">
        <h2>4. High-Clarity Live Output</h2>
        <div class="chart-preview-container">
            <canvas id="ganttCanvas"></canvas>
        </div>
    </div>

</div>

<script>
let ganttTasks = [];

function populateTable() {
    const tbody = document.getElementById("taskTableBody");
    tbody.innerHTML = "";
    
    ganttTasks.forEach((item, index) => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
            <td><input class="cell-input num-input" value="${item.id}" onchange="updateTask(${index}, 'id', this.value)"></td>
            <td><input class="cell-input" value="${item.name}" onchange="updateTask(${index}, 'name', this.value)"></td>
            <td>
                <select class="cell-input" onchange="updateTask(${index}, 'type', this.value)">
                    <option value="stage" ${item.type==='stage'?'selected':''}>Stage</option>
                    <option value="activity" ${item.type==='activity'?'selected':''}>Activity</option>
                </select>
            </td>
            <td><input type="number" step="0.1" class="cell-input num-input" value="${item.start}" onchange="updateTask(${index}, 'start', parseFloat(this.value))"></td>
            <td><input type="number" step="0.1" class="cell-input num-input" value="${item.end}" onchange="updateTask(${index}, 'end', parseFloat(this.value))"></td>
            <td><button class="btn-danger" onclick="deleteTask(${index})">X</button></td>
        `;
        tbody.appendChild(tr);
    });
}

function updateTask(index, prop, value) {
    ganttTasks[index][prop] = value;
    renderGantt();
}

function addTask() {
    ganttTasks.push({ id: `${ganttTasks.length + 1}`, name: "New Task", type: "activity", start: 0, end: 2 });
    populateTable();
    renderGantt();
}

function deleteTask(index) {
    ganttTasks.splice(index, 1);
    populateTable();
    renderGantt();
}

function clearImportText() {
    document.getElementById("importText").value = "";
}

function parseTextToTasks() {
    const rawText = document.getElementById("importText").value.trim();
    if (!rawText) return;

    const lines = rawText.split("\n");
    const parsed = [];

    lines.forEach((line) => {
        let clean = line.trim();
        if (!clean) return;

        // Clean out bullet symbols
        clean = clean.replace(/^[\-\*\•\>\s]+/, "");

        let type = "activity";
        if (/^(Phase|Stage)\s+\d+/i.test(clean) || /^[A-Z0-9\s]{4,}:/.test(clean)) {
            type = "stage";
        }

        let start = 0;
        let end = 2;

        // Extract explicit Start/End tags
        const startMatch = clean.match(/Start:\s*([\d\.]+)/i);
        const endMatch = clean.match(/End:\s*([\d\.]+)/i);

        if (startMatch && endMatch) {
            start = parseFloat(startMatch[1]);
            end = parseFloat(endMatch[1]);
        } else {
            // Fallback: match general week numbers like Week 1-2
            const numbers = clean.match(/(\d+(\.\d+)?)/g);
            if (numbers && numbers.length >= 2) {
                start = parseFloat(numbers[numbers.length - 2]);
                end = parseFloat(numbers[numbers.length - 1]);
            }
        }

        // Extract clean ID and Title
        let id = "";
        let name = clean;

        const idMatch = clean.match(/^((Phase\s+\d+|Stage\s+\d+|\d+\.\d+|\d+))\:?\s*(.*)/i);
        if (idMatch) {
            id = idMatch[1];
            name = idMatch[3];
        }

        // Clean parameter annotations
        name = name.replace(/\|?\s*Start:\s*[\d\.]+\s*,?\s*End:\s*[\d\.]+.*/gi, "").trim();

        parsed.push({
            id: id || (type === "stage" ? "Stage" : "Task"),
            name: name || clean,
            type: type,
            start: isNaN(start) ? 0 : start,
            end: isNaN(end) ? start + 1 : end
        });
    });

    if (parsed.length > 0) {
        ganttTasks = parsed;
        populateTable();
        renderGantt();
    }
}

function renderGantt() {
    const canvas = document.getElementById("ganttCanvas");
    const ctx = canvas.getContext("2d");

    const mode = document.getElementById("timeMode").value;
    const startDateInput = new Date(document.getElementById("startDate").value || "2026-06-14");
    const rowSpacing = parseInt(document.getElementById("rowSpacing").value);
    const barH = parseInt(document.getElementById("barHeight").value);
    
    document.getElementById("rowSpacingVal").innerText = rowSpacing + "px";
    document.getElementById("barHeightVal").innerText = barH + "px";

    // Determine max units dynamically
    let maxUnit = 12;
    ganttTasks.forEach(t => { if (t.end > maxUnit) maxUnit = Math.ceil(t.end); });

    const dpr = window.devicePixelRatio || 2; 
    const taskColWidth = 460;
    const unitWidth = mode === "days" ? 35 : (mode === "months" ? 70 : 50);
    const timelineWidth = maxUnit * unitWidth; 
    const margin = 30;

    const totalWidth = taskColWidth + timelineWidth + (margin * 2);
    const headerHeight = 60;
    const titleHeight = 50;
    const legendHeight = 50;
    const totalHeight = titleHeight + headerHeight + (ganttTasks.length * rowSpacing) + legendHeight;

    canvas.width = totalWidth * dpr;
    canvas.height = totalHeight * dpr;
    canvas.style.width = totalWidth + "px";
    canvas.style.height = totalHeight + "px";

    ctx.scale(dpr, dpr);

    ctx.fillStyle = "#ffffff";
    ctx.fillRect(0, 0, totalWidth, totalHeight);

    const colorHeaderBg = "#f1f3f5";
    const colorGrid = "#dee2e6";
    const colorBlue = "#2563eb";
    const colorGrey = "#334155";

    // Title
    ctx.fillStyle = "#0f172a";
    ctx.font = "bold 20px Arial";
    ctx.fillText("Project Timeline & Implementation Plan", margin, 35);

    const startX = margin;
    const startY = titleHeight;

    // Task Header Box
    ctx.fillStyle = colorHeaderBg;
    ctx.fillRect(startX, startY, taskColWidth, headerHeight);
    ctx.strokeStyle = "#94a3b8";
    ctx.lineWidth = 1;
    ctx.strokeRect(startX, startY, taskColWidth, headerHeight);

    ctx.fillStyle = "#0f172a";
    ctx.font = "bold 14px Arial";
    ctx.textAlign = "center";
    ctx.fillText("Tasks / Phases", startX + (taskColWidth / 2), startY + (headerHeight / 2) + 5);

    // DUAL-TIER HEADER (Merged top level, detailed bottom units)
    if (mode === "weeks") {
        // Group weeks into Merged Months
        let weekMap = [];
        for (let w = 0; w < maxUnit; w++) {
            let d = new Date(startDateInput);
            d.setDate(d.getDate() + (w * 7));
            let monthName = d.toLocaleString('en-US', { month: 'short', year: '2-digit' }).toUpperCase();
            weekMap.push({ weekNum: w + 1, month: monthName });
        }

        // 1. Top Tier: Merged Month Headers
        let currentMonth = null;
        let monthStartIdx = 0;
        let monthSpan = 0;

        for (let i = 0; i <= weekMap.length; i++) {
            if (i < weekMap.length && weekMap[i].month === currentMonth) {
                monthSpan++;
            } else {
                if (currentMonth !== null) {
                    const monthX = startX + taskColWidth + (monthStartIdx * unitWidth);
                    const monthWidth = monthSpan * unitWidth;

                    ctx.fillStyle = colorHeaderBg;
                    ctx.fillRect(monthX, startY, monthWidth, headerHeight / 2);
                    ctx.strokeRect(monthX, startY, monthWidth, headerHeight / 2);

                    ctx.fillStyle = "#0f172a";
                    ctx.font = "bold 11px Arial";
                    ctx.fillText(currentMonth, monthX + (monthWidth / 2), startY + 20);
                }
                if (i < weekMap.length) {
                    currentMonth = weekMap[i].month;
                    monthStartIdx = i;
                    monthSpan = 1;
                }
            }
        }

        // 2. Bottom Tier: Week Columns
        for (let w = 0; w < maxUnit; w++) {
            const weekX = startX + taskColWidth + (w * unitWidth);
            ctx.fillStyle = colorHeaderBg;
            ctx.fillRect(weekX, startY + (headerHeight / 2), unitWidth, headerHeight / 2);
            ctx.strokeRect(weekX, startY + (headerHeight / 2), unitWidth, headerHeight / 2);

            ctx.fillStyle = "#334155";
            ctx.font = "11px Arial";
            ctx.fillText(`Wk ${w + 1}`, weekX + (unitWidth / 2), startY + headerHeight - 10);
        }

    } else if (mode === "months") {
        // Months Mode: Top Merged Quarters, Bottom Months
        for (let m = 0; m < maxUnit; m++) {
            let d = new Date(startDateInput);
            d.setMonth(d.getMonth() + m);
            let monthLabel = d.toLocaleString('en-US', { month: 'short', year: '2-digit' });

            const monthX = startX + taskColWidth + (m * unitWidth);
            ctx.fillStyle = colorHeaderBg;
            ctx.fillRect(monthX, startY, unitWidth, headerHeight);
            ctx.strokeRect(monthX, startY, unitWidth, headerHeight);

            ctx.fillStyle = "#0f172a";
            ctx.font = "bold 11px Arial";
            ctx.fillText(monthLabel, monthX + (unitWidth / 2), startY + (headerHeight / 2) + 4);
        }
    } else {
        // Days Mode
        for (let dIdx = 0; dIdx < maxUnit; dIdx++) {
            let d = new Date(startDateInput);
            d.setDate(d.getDate() + dIdx);
            let dayLabel = `Day ${dIdx + 1}`;

            const dayX = startX + taskColWidth + (dIdx * unitWidth);
            ctx.fillStyle = colorHeaderBg;
            ctx.fillRect(dayX, startY, unitWidth, headerHeight);
            ctx.strokeRect(dayX, startY, unitWidth, headerHeight);

            ctx.fillStyle = "#0f172a";
            ctx.font = "11px Arial";
            ctx.fillText(dayLabel, dayX + (unitWidth / 2), startY + (headerHeight / 2) + 4);
        }
    }

    // Task Rows
    let currentY = startY + headerHeight;

    ganttTasks.forEach((item) => {
        ctx.strokeStyle = colorGrid;
        ctx.strokeRect(startX, currentY, taskColWidth + timelineWidth, rowSpacing);

        ctx.textAlign = "left";
        if (item.type === 'stage') {
            ctx.fillStyle = "#0f172a";
            ctx.font = "bold 12px Arial";
            ctx.fillText(`${item.id}: ${item.name}`, startX + 10, currentY + (rowSpacing / 2) + 4);

            // Phase Bracket Line
            const barX1 = startX + taskColWidth + (item.start * unitWidth);
            const barX2 = startX + taskColWidth + (item.end * unitWidth);
            const midY = currentY + (rowSpacing / 2);

            ctx.strokeStyle = colorGrey;
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(barX1, midY);
            ctx.lineTo(barX2, midY);
            ctx.stroke();

            // End Bracket Hooks
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(barX1, midY - 5); ctx.lineTo(barX1, midY + 5);
            ctx.moveTo(barX2, midY - 5); ctx.lineTo(barX2, midY + 5);
            ctx.stroke();
        } else {
            ctx.fillStyle = "#334155";
            ctx.font = "12px Arial";
            const label = item.id ? `${item.id} ${item.name}` : item.name;
            ctx.fillText(`   ${label}`, startX + 15, currentY + (rowSpacing / 2) + 4);

            // Activity Bar
            const barX = startX + taskColWidth + (item.start * unitWidth);
            const barW = Math.max((item.end - item.start) * unitWidth, 2);
            const barY = currentY + (rowSpacing - barH) / 2;

            ctx.fillStyle = colorBlue;
            ctx.fillRect(barX, barY, barW, barH);
        }

        currentY += rowSpacing;
    });

    // Vertical Grid Lines
    for (let u = 0; u <= maxUnit; u++) {
        const gridX = startX + taskColWidth + (u * unitWidth);
        ctx.strokeStyle = colorGrid;
        ctx.lineWidth = 0.5;

        ctx.beginPath();
        ctx.moveTo(gridX, startY + headerHeight);
        ctx.lineTo(gridX, currentY);
        ctx.stroke();
    }

    // Chart Border Box
    ctx.strokeStyle = "#0f172a";
    ctx.lineWidth = 1;
    ctx.strokeRect(startX, startY, taskColWidth + timelineWidth, currentY - startY);

    // Legend
    const legendY = currentY + 25;
    ctx.font = "12px Arial";
    ctx.textAlign = "left";

    ctx.strokeStyle = colorGrey;
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(startX + taskColWidth + 20, legendY);
    ctx.lineTo(startX + taskColWidth + 50, legendY);
    ctx.stroke();

    ctx.fillStyle = "#000";
    ctx.fillText("= Stage / Phase Bar", startX + taskColWidth + 58, legendY + 4);

    ctx.fillStyle = colorBlue;
    ctx.fillRect(startX + taskColWidth + 210, legendY - 6, 25, 12);
    
    ctx.fillStyle = "#000";
    ctx.fillText("= Activity / Task Bar", startX + taskColWidth + 242, legendY + 4);
}

function exportFullImage() {
    const canvas = document.getElementById("ganttCanvas");
    const imageURI = canvas.toDataURL("image/png");
    
    const link = document.createElement("a");
    link.download = "Gantt_Chart_Export.png";
    link.href = imageURI;
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
}

window.onload = () => {
    // Initial blank state / ready to receive custom input
    renderGantt();
};
</script>

</body>
</html>
